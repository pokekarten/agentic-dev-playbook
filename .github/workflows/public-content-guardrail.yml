name: Public content guardrail

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-content-guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check newly introduced commit metadata
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/check_commit_email_privacy.py
          "$BASE_SHA"
          "$HEAD_SHA"
          --bootstrap-path scripts/check_commit_email_privacy.py

      - name: Check all public Markdown content
        run: python3 scripts/check_public_content.py

      - name: Check resource-aware starter artifacts
        run: python3 scripts/check_resource_aware_starter.py

      - name: Parse starter workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.parse_file("starter-kits/resource-aware-github/.github/workflows/resource-aware-gate.yml"); puts "Starter workflow YAML parsed."'
