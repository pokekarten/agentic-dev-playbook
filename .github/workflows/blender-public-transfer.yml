name: blender-public-transfer

on:
  push:
    branches:
      - chatgpt/blender-transfer-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify Blender
        shell: bash
        run: |
          set -euo pipefail
          VERSION=5.2.2
          BASE=https://download.blender.org/release/Blender5.2
          FILE=blender-${VERSION}-linux-x64.tar.xz

          curl -fL --retry 5 --retry-delay 5 -o "${FILE}" "${BASE}/${FILE}"
          curl -fL --retry 5 --retry-delay 5 -o blender.sha256 "${BASE}/blender-${VERSION}.sha256"

          grep " ${FILE}$" blender.sha256 | sha256sum -c -
          sha256sum "${FILE}" > "${FILE}.sha256"

      - name: Publish temporary public release asset
        id: release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=5.2.2
          FILE=blender-${VERSION}-linux-x64.tar.xz
          TAG=blender-transfer-${VERSION}

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILE}" "${FILE}.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" "${FILE}" "${FILE}.sha256" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Temporary Blender ${VERSION} transfer" \
              --notes "Official Blender Linux x64 archive mirrored temporarily from download.blender.org and verified against Blender's published SHA-256 file."
          fi

      - name: Upload workflow artifact fallback
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.2-linux-x64
          path: |
            blender-5.2.2-linux-x64.tar.xz
            blender-5.2.2-linux-x64.tar.xz.sha256
          compression-level: 0
          retention-days: 1
