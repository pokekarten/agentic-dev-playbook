name: One-time stale branch prune

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only branches from verified merged PRs
        shell: bash
        run: |
          set -euo pipefail
          pairs=(
            'agent/canonical-knowledge-routing:5'
            'agent/portable-r-4.6.1-runtime:4'
            'privacy/6-commit-email-gate:7'
            'agent/base-trusted-commit-email-privacy:8'
            'chatgpt/resource-aware-starter-pack:1'
            'chatgpt/resource-aware-starter-hardening:2'
          )

          for pair in "${pairs[@]}"; do
            branch="${pair%:*}"
            pr="${pair##*:}"
            merged_at="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged_at // ""')"
            head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.ref')"
            if [[ -z "$merged_at" || "$head_ref" != "$branch" ]]; then
              echo "REFUSE: ${branch} is not the verified merged head of PR #${pr}" >&2
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "deleted ${branch} from merged PR #${pr}"
          done
